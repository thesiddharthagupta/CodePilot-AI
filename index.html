<!DOCTYPE html>
<html>
<head>
<title>CollabCode V4.0</title>

<style>
body {
    font-family: Arial;
    background-color: #0f172a;
    color: white;
    padding: 20px;
}
.dark {
    background-color: white;
    color: black;
}
textarea {
    width: 100%;
    height: 150px;
    padding: 10px;
    background: #34496a;
    color: white;
}
button {
    padding: 10px 15px;
    margin: 5px;
    cursor: pointer;
}
#output {
    background: #1e293b;
    padding: 10px;
    min-height: 80px;
    white-space: pre-wrap;
}
#chatBox {
    background: #1e293b;
    height: 120px;
    overflow-y: auto;
    padding: 5px;
}
</style>

</head>
<body>

<h2>👨‍💻• CollabCode – AI Assisted Collaborative Coding Platform</h2>

<!-- LOGIN SECTION -->
<div id="loginSection">
<h3>Login</h3>
<input type="text" id="username" placeholder="Enter Username">
<button onclick="login()">Login</button>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">

<h3>Python Code Editor</h3>
<textarea id="codeArea" placeholder="Write Python code..."></textarea>

<button onclick="runCode()">Run Python</button>
<button onclick="aiAssist()">AI Suggest</button>
<button onclick="toggleMode()">Toggle Theme</button>

<h3>Output</h3>
<div id="output"></div>

<h3>Team Chat</h3>
<div id="chatBox"></div>
<input type="text" id="chatInput" placeholder="Type message">
<button onclick="sendMessage()">Send</button>

</div>

<script>

function login(){
    let user = document.getElementById("username").value;
    if(user.trim() !== ""){
        document.getElementById("loginSection").style.display="none";
        document.getElementById("mainApp").style.display="block";
        document.getElementById("chatBox").innerHTML += 
            "<p><b>System:</b> "+user+" joined the session.</p>";
    }
}

// REAL PYTHON EXECUTION
async function runCode() {
    let code = document.getElementById("codeArea").value;
    document.getElementById("output").innerText = "Running...";

    try {
        const response = await fetch("https://emkc.org/api/v2/piston/execute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                language: "python",
                version: "3.10.0",
                files: [{ content: code }]
            })
        });

        const result = await response.json();

        if (result.run.stderr) {
            document.getElementById("output").innerText = result.run.stderr;
        } else {
            document.getElementById("output").innerText = result.run.output;
        }

    } catch (error) {
        document.getElementById("output").innerText = "Internet Required!";
    }
}

// AI SUGGESTION
function aiAssist(){
    let code = document.getElementById("codeArea").value;

    if(code.includes("pritn")){
        document.getElementById("output").innerText =
            "AI Suggestion: Did you mean 'print'?";
    }
    else if(code.includes("while") && !code.includes(":")){
        document.getElementById("output").innerText =
            "AI Suggestion: Check colon ':' after while condition.";
    }
    else{
        document.getElementById("output").innerText =
            "AI Suggestion: Code looks syntactically correct!";
    }
}

// CHAT
function sendMessage(){
    let msg = document.getElementById("chatInput").value;
    if(msg.trim() !== ""){
        document.getElementById("chatBox").innerHTML += 
            "<p><b>You:</b> "+msg+"</p>";
        document.getElementById("chatInput").value="";
    }
}

// THEME
function toggleMode(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
