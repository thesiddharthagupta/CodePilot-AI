version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabcode-ide
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=collabcode_docker_production_key_2026
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - collabcode-data:/app/data

volumes:
  collabcode-data:
    driver: local
